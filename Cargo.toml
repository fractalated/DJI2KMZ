[workspace]
resolver = "3"
members = ["core", "native", "web"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
dji-log-parser = "0.5.7"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
thiserror = "2.0.19"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# "wasm" feature: routes rust_xlsxwriter's internal metadata-timestamp
# clock through js_sys::Date::now() on wasm32 instead of
# SystemTime::now(), which panics (surfaces in a browser as an
# "unreachable" trap) on bare wasm32-unknown-unknown. The cfg this feature
# gates is itself scoped to target_arch = "wasm32", so enabling it is a
# no-op for the native build.
rust_xlsxwriter = { version = "0.96.0", features = ["wasm"] }
calamine = "0.36.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
